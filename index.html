<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARG Game Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <main class="dashboard-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SAYMP LABS</div>
        <h1>ARG Game Engine</h1>
        <p>Cria pequenos jogos 2D narrativos diretamente no browser.</p>
      </div>
      <button id="newProjectBtn" class="primary-btn">+ Criar projeto</button>
    </header>

    <section>
      <div class="section-title">
        <h2>Meus projetos</h2>
        <span id="projectCount" class="pill">0</span>
      </div>

      <div id="projectGrid" class="project-grid"></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">🎮</div>
        <h3>Ainda não tens projetos</h3>
        <p>Cria o primeiro e começa a construir o teu minijogo.</p>
      </div>
    </section>
  </main>

  <dialog id="newProjectDialog" class="modal">
    <form method="dialog" id="newProjectForm">
      <div class="modal-head">
        <div>
          <div class="eyebrow">NOVO PROJETO</div>
          <h2>Criar jogo</h2>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Fechar">✕</button>
      </div>

      <label>
        Nome do projeto
        <input id="projectName" maxlength="40" placeholder="Ex.: UniversaLand" required />
      </label>

      <label>
        Nome do primeiro mapa
        <input id="mapName" maxlength="40" value="Sala Inicial" required />
      </label>

      <div class="modal-actions">
        <button value="cancel" class="secondary-btn">Cancelar</button>
        <button type="submit" value="default" class="primary-btn">Criar projeto</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
