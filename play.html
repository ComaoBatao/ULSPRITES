<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play — ARG Game Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="play-body">
  <div id="gameShell" class="game-shell">
    <canvas id="gameCanvas"></canvas>

    <div class="game-ui">
      <div class="game-badge">
        <strong id="gameProjectName">Projeto</strong>
        <span id="gameMapName">Mapa</span>
      </div>

      <div class="controls-badge">
        WASD / Setas · ESC para sair
      </div>
    </div>

    <div id="pauseOverlay" class="pause-overlay hidden">
      <div class="pause-card">
        <div class="eyebrow">TEST MODE</div>
        <h2>Jogo pausado</h2>
        <p>Voltar ao editor?</p>
        <div class="pause-actions">
          <button id="resumeBtn" class="secondary-btn">Continuar</button>
          <button id="backEditorBtn" class="primary-btn">Voltar ao editor</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
