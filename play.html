<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Play — ARG Game Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="play-body">
  <div class="game-shell">
    <canvas id="gameCanvas"></canvas>

    <div class="game-ui">
      <div class="game-badge">
        <strong id="gameProjectName">Projeto</strong>
        <span id="gameMapName">Mapa</span>
      </div>
      <div class="controls-badge">WASD / Setas · E interagir · ESC menu</div>
    </div>

    <div id="interactionPrompt" class="interaction-prompt hidden">E · Interagir</div>
    <div id="dialogBox" class="dialog-box hidden">
      <div id="dialogSpeaker" class="dialog-speaker"></div>
      <div id="dialogText" class="dialog-text"></div>
      <div class="dialog-help">E / Enter para fechar</div>
    </div>

    <div id="pauseOverlay" class="pause-overlay hidden">
      <div class="pause-card">
        <div class="eyebrow">TEST MODE</div>
        <h2>Jogo pausado</h2>
        <div class="pause-actions">
          <button id="resumeBtn" class="secondary-btn">Continuar</button>
          <button id="backEditorBtn" class="primary-btn">Voltar ao editor</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
